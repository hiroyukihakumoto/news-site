<h1>Record release of emergency oil reserves planned as prices surge</h1>
<p>ニュースの内容をわかりやすく説明します。

タイトル：
原油価格の急騰に対応し、非常用石油備蓄の史上最大規模の放出が計画される

内容の説明：
アメリカとイスラエルの戦争がイランと関係して始まったことで、石油の価格が大きく上がっています。これを受けて、アメリカや日本、イギリス、ドイツなどの主要7か国（G7）は、市場の安定を図るために、非常用に備えてある石油の備蓄を大量に放出する案を支持しています。つまり、石油の供給を増やして価格の高騰を抑えようという動きです。</p>
